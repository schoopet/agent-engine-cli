name: Build Binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and attach binaries to (e.g. v0.2.0)
        required: true

permissions:
  contents: write  # Required to upload release assets

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-latest
            asset_name: ae-linux-x86_64
          - os: macos
            arch: arm64
            runner: macos-latest
            asset_name: ae-macos-arm64
          - os: macos
            arch: x86_64
            runner: macos-26-intel
            asset_name: ae-macos-x86_64
          - os: windows
            arch: x86_64
            runner: windows-latest
            asset_name: ae-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install .

      - name: Build binary
        run: >
          pyinstaller
          --onefile
          --name ${{ matrix.asset_name }}
          --hidden-import agentplatform
          --collect-submodules agentplatform
          --copy-metadata agent-engine-cli
          --hidden-import google.cloud.aiplatform
          --hidden-import google.auth
          --hidden-import google.auth.transport.requests
          --hidden-import google.oauth2.credentials
          --hidden-import google.oauth2.service_account
          --collect-submodules google.cloud.aiplatform
          src/agent_engine_cli/__main__.py

      - name: Upload binary to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/${{ matrix.asset_name }}
